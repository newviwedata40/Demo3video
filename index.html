<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoData</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; padding: 20px; color: white; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 15px; margin-bottom: 30px; border: 1px solid #334155; }
        #linksList { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .video-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; transition: all 0.3s ease; position: relative; }
        .video-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .play-area { cursor: pointer; margin-bottom: 15px; }
        .play-icon { width: 50px; height: 50px; background: #38bdf8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 20px; color: #0f172a; }
        .video-title { font-size: 16px; font-weight: 600; color: #f1f5f9; margin-bottom: 15px; }
        .download-btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .download-btn:hover { background: #16a34a; }
        
        /* Ad Modal */
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; }
        #adFrame { width: 100%; height: 100%; border: none; }
        #timerOverlay { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 50px; font-weight: bold; z-index: 3001; }

        /* Video Player Overlay (Smart Design) */
        #videoModal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .player-wrapper {
            position: relative;
            width: 95%; /* Mobile friendly width */
            max-width: 900px; /* PC friendly max-width */
            height: auto;
            max-height: 85vh; /* Prevents overflow */
            background: #000;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        #mainPlayer, #embedPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Spinner (Loader) */
        .loader {
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Handle Portrait Videos (Smart detection) */
        .player-wrapper.portrait {
            max-width: 450px;
        }
        .player-wrapper.portrait .video-container {
            padding-top: 177%; /* 9:16 Aspect Ratio */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Boy Demo Videos</h1>
        <p>ڈیمو دیکھنے کے بعد اور ویڈیو کیلیے رابطہ کریں!</p>
    </div>
    <div id="linksList"></div>
</div>

<!-- Video Player Modal -->
<div id="videoModal">
    <div class="player-wrapper" id="pWrapper">
        <button class="close-btn" onclick="closePlayer()">CLOSE ✕</button>
        <div class="video-container">
            <div class="loader" id="videoLoader"></div>
            <video id="mainPlayer" controls controlsList="nodownload"></video>
            <iframe id="embedPlayer" allowfullscreen></iframe>
        </div>
    </div>
</div>

<div id="adModal">
    <div id="timerOverlay">Please wait: <span id="seconds">15</span>s</div>
    <iframe id="adFrame" src=""></iframe>
</div>

document.addEventListener('DOMContentLoaded', function() {

});

document.addEventListener("visibilitychange", function() {
    if (document.hidden) closePlayer();
});

function handlePlay(url) {
    playCount++;

    } else {

    }
}
